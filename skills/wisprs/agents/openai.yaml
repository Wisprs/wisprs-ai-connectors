interface:
  display_name: Wisprs
  short_description: Transcribe, search, and reuse recordings.
  icon_small: ./assets/wisprs-icon.png
  icon_large: ./assets/wisprs-logo.png
  brand_color: "#7C3AED"
  default_prompt: Transcribe this recording with Wisprs and show me the transcript when it is ready.
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - transcribe_file
    - transcribe_url
    - get_job_status
    - get_transcript
